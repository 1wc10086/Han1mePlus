name: han1me_plus
description: Flutter client for browsing Han1me content.
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  html: ^0.15.5
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  video_player: ^2.9.2
  shared_preferences: ^2.3.3
  dynamic_color: ^1.7.0
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5
  open_filex: ^4.7.0
  archive: ^3.6.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png

flutter_native_splash:
  color: '#f7f7fb'
  color_dark: '#101114'
  image: assets/logo.png
  image_dark: assets/logo.png
  android_12:
    color: '#f7f7fb'
    color_dark: '#101114'
    image: assets/logo.png
    image_dark: assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: assets/logo.png
  adaptive_icon_background: '#101114'
  adaptive_icon_foreground: assets/logo.png
  
  # assets:
  #   - images/
  
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
