name: Build APK (ech-static)

on:
  push:
    branches: [ech-static]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Han1mePlus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.3.11579264" >/dev/null
          echo "NDK installed: $ANDROID_HOME/ndk/26.3.11579264"

      - name: Build ech_http native .so (static ECH engine)
        run: |
          set -e
          git clone --depth 1 https://github.com/anglesgirl/ech_http.git ech_http_src
          cd ech_http_src
          # 校验并解压预编译依赖 SDK（curl + BoringSSL 静态库）
          SHA="5b2b125396921ce00dc3026d8943276f66786e9334f708391e1afcb23462ae3a"
          curl -fsSL -o deps.zip "https://github.com/ech-research/libechhttp-android-build/releases/download/v0.1.0/libechhttp-deps-v0.1.0-android-arm64.zip"
          echo "$SHA  deps.zip" | sha256sum -c -
          unzip -q deps.zip -d deps
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          cmake -S src -B build -G Ninja \
            -DEH_DEPS_ROOT="$PWD/deps" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static
          cmake --build build
          ls -la build/out/libech_http.so
          mkdir -p "$GITHUB_WORKSPACE/Han1mePlus/android/app/src/main/jniLibs/arm64-v8a"
          cp build/out/libech_http.so "$GITHUB_WORKSPACE/Han1mePlus/android/app/src/main/jniLibs/arm64-v8a/"

      - name: Flutter pub get
        working-directory: Han1mePlus
        run: flutter pub get

      - name: Build release APK (arm64)
        working-directory: Han1mePlus
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: han1meplus-ech-static-apk
          path: Han1mePlus/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
