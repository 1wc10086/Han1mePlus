name: Build APK (ech-static)

on:
  push:
    branches: [ech-static]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Han1mePlus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android NDK
        run: |
          set -e
          # 优先复用 runner 自带的 NDK；没有则用 sdkmanager 安装
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            SDKMANAGER=""
            for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
            done
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::sdkmanager not found under $ANDROID_HOME"
              exit 1
            fi
            echo "y" | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "ndk;26.3.11579264" >/dev/null
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Build ech_http native .so (static ECH engine)
        run: |
          set -e
          git clone --depth 1 https://github.com/anglesgirl/ech_http.git ech_http_src
          cd ech_http_src
          # 校验并解压预编译依赖 SDK（curl + BoringSSL 静态库）
          SHA="5b2b125396921ce00dc3026d8943276f66786e9334f708391e1afcb23462ae3a"
          curl -fsSL -o deps.zip "https://github.com/ech-research/libechhttp-android-build/releases/download/v0.1.0/libechhttp-deps-v0.1.0-android-arm64.zip"
          echo "$SHA  deps.zip" | sha256sum -c -
          unzip -q deps.zip -d deps
          cmake -S src -B build -G Ninja \
            -DEH_DEPS_ROOT="$PWD/deps" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static
          cmake --build build
          ls -la build/out/libech_http.so
          mkdir -p "$GITHUB_WORKSPACE/Han1mePlus/android/app/src/main/jniLibs/arm64-v8a"
          cp build/out/libech_http.so "$GITHUB_WORKSPACE/Han1mePlus/android/app/src/main/jniLibs/arm64-v8a/"

      - name: Flutter pub get
        working-directory: Han1mePlus
        run: flutter pub get

      - name: Build release APK (arm64)
        working-directory: Han1mePlus
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect APK
        run: |
          pwd
          find "$GITHUB_WORKSPACE" -name "app-release.apk" 2>/dev/null | head -5
          APK="$(find "$GITHUB_WORKSPACE" -name 'app-release.apk' -print -quit)"
          if [ -z "$APK" ]; then echo "::error::APK not found"; exit 1; fi
          cp "$APK" "$GITHUB_WORKSPACE/han1meplus-ech-static.apk"
          ls -la "$GITHUB_WORKSPACE/han1meplus-ech-static.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: han1meplus-ech-static-apk
          path: han1meplus-ech-static.apk
          if-no-files-found: error
