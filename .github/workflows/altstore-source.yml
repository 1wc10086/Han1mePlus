name: Update AltStore source

# Keeps altstore/source.json in sync with the published GitHub releases, so the
# SideStore / LiveContainer source always advertises the newest ipa without any
# manual step. See altstore/generate.py for the generator.

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

# Required so the bot can commit the refreshed source back to the repository.
permissions:
  contents: write

concurrency:
  group: altstore-source
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh altstore/source.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate the source
        env:
          # Raises the GitHub API rate limit; the token is provided automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 altstore/generate.py

      - name: Commit the result
        run: |
          set -euo pipefail
          if git diff --quiet -- altstore/source.json; then
            echo "altstore/source.json is already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git commit -m "chore(altstore): refresh source.json"
          git push
